<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>YourIASBuddy — UPSC Study Companion</title>
  <meta name="description" content="YourIASBuddy: daily tracker, study-hours timer, reminders, notes, curated resources and AI-powered UPSC Prelims & Mains quizzes." />
  <meta name="theme-color" content="#14161d" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/img/icon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="assets/img/icon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <script>
    // Apply theme before paint to avoid a flash.
    try {
      var s = JSON.parse(localStorage.getItem('yib:v1') || '{}');
      var t = (s.settings && s.settings.theme) || 'system';
      if (t !== 'system') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/dashboard" aria-label="YourIASBuddy home">
        <img class="brand-mark" src="assets/img/logo-mark.png" alt="" width="46" height="46" />
        <span class="brand-text"><span class="brand-name">Your<b>IAS</b>Buddy<i>.com</i></span><span class="brand-tag">Prepare · Learn · Revise · Crack UPSC</span></span>
      </a>
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <div class="sidebar-foot">
        <div class="countdown-card" id="countdownCard"></div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <a class="brand-mini" href="#/dashboard" aria-label="YourIASBuddy home"><img class="brand-mark" src="assets/img/logo-mark.png" alt="" width="40" height="40" /></a>
        <div class="topbar-title">
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSub" class="muted"></p>
        </div>
        <div class="topbar-actions">
          <a class="timer-chip" id="timerChip" href="#/study" hidden></a>
          <a class="icon-btn mobile-only" href="#/reminders" id="remBtn" title="Reminders" aria-label="Reminders"></a>
          <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme"></button>
          <a class="icon-btn" href="#/settings" title="Settings" aria-label="Settings" id="settingsBtn"></a>
          <a class="icon-btn account-btn" href="#/profile" title="Profile" aria-label="Profile" id="accountBtn"></a>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
      <footer class="site-footer">
        <span class="footer-copy">© <span id="year">2026</span> YourIASBuddy</span>
        <nav class="footer-links" aria-label="Legal"><a href="privacy.html">Privacy</a><span aria-hidden="true">·</span><a href="terms.html">Terms</a><span aria-hidden="true">·</span><a href="#/faq">FAQs</a><span aria-hidden="true">·</span><a href="#/contact">Contact</a></nav>
        <div class="footer-end"><span class="footer-social"><a href="https://www.instagram.com/youriasbuddy/" target="_blank" rel="noopener" aria-label="YourIASBuddy on Instagram" title="Instagram @youriasbuddy"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="20" x="2" y="2" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/></svg></a><a href="https://x.com/youriasbuddy" target="_blank" rel="noopener" aria-label="YourIASBuddy on X (formerly Twitter)" title="X @youriasbuddy"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.24 2.25h3.31l-7.23 8.26 8.5 11.24h-6.65l-5.21-6.82-5.97 6.82H1.68l7.73-8.84L1.25 2.25h6.83l4.71 6.23zm-1.16 17.52h1.83L7.08 4.13H5.12z"/></svg></a><a href="mailto:youriasbuddy@gmail.com" aria-label="Email YourIASBuddy" title="youriasbuddy@gmail.com"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></a></span><p class="footer-credit">Designed and Developed by <a class="credit" href="https://raushanraj.in" target="_blank" rel="noopener">Raushan Raj</a></p></div>
      </footer>
    </div>

    <nav class="tabbar" id="tabbar" aria-label="Mobile"></nav>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modalRoot"></div>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
